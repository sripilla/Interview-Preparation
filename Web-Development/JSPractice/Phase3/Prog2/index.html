
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>JavaScript Events Practice</title>

    <!-- Styles the webpage -->
    <style>
        /* Style the main heading */
        h1 {
            color: navy;
        }

        /* Style the message paragraph */
        #message {
            color: green;
            font-size: 18px;
        }

        /* Style the buttons */
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Main heading -->
    <h1 id="title">Student Greeting</h1>

    <!-- Input where the user enters their name -->
    <input id="studentName" type="text" placeholder="Enter your name">

    <!-- Button that triggers a click event -->
    <button id="greetButton">Greet Me</button>

    <!-- Button that clears the message -->
    <button id="clearButton">Clear Message</button>

    <!-- JavaScript will display messages here -->
    <p id="message">Your greeting will appear here.</p>

    <!-- Connects the external JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
