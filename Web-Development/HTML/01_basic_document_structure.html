<!-- =========================================================
   SECTION 1: BASIC HTML DOCUMENT STRUCTURE
   ========================================================= -->

<!--
QUICK THEORY REVISION

1. <!DOCTYPE html>
   - Tells the browser that this document uses HTML5.
   - It should be the first line of an HTML document.

2. <html>
   - The root element of the entire HTML page.
   - The lang attribute tells the browser the language of the page.
   - Example: <html lang="en">

3. <head>
   - Contains information ABOUT the webpage.
   - Most content inside <head> is NOT directly visible on the page.
   - Common elements inside <head>:
       * <meta>
       * <title>
       * CSS links

4. <meta charset="UTF-8">
   - Defines the character encoding.
   - UTF-8 supports many characters and languages.

5. <meta name="viewport" ...>
   - Helps the webpage display correctly on mobile devices.

6. <title>
   - Sets the text shown on the browser tab.
   - It is NOT displayed inside the webpage itself.

7. <body>
   - Contains everything visible to the user.
   - Examples:
       * Headings
       * Paragraphs
       * Images
       * Links
       * Forms
       * Buttons

BASIC STRUCTURE:

<!DOCTYPE html>
<html>
    <head>
        Information about the page
    </head>

    <body>
        Visible webpage content
    </body>
</html>
-->


<!-- =========================================================
   PROGRAM: MY FIRST HTML PAGE
   ========================================================= -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First HTML Page</title>
</head>

<body>

    <h1>Welcome to My First Webpage</h1>

    <p>
        I am learning HTML and building my foundation before moving to CSS,
        JavaScript, and React.
    </p>

    <p>
        This content is visible because it is inside the body element.
    </p>

</body>

</html>
